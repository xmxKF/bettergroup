<!DOCTYPE html>
<html lang="{{ x_default_html_lang }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · {{ site_name }} · {{ site_name_en }}</title>
<meta name="robots" content="noindex,follow">

<link rel="icon" href="assets/img/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png">
<link rel="apple-touch-icon" href="assets/img/favicon-180.png">
<meta name="theme-color" content="#101A2B">

<!-- 樣式與 gateway.html 一致；兩者都是站台外殼，不套用 assets/css/style.css。 -->
<style>
  html,body{ margin:0; padding:0; }
  body{
    min-height:100dvh; display:flex; align-items:center; justify-content:center;
    background:#101A2B; color:#F2F5F8;
    font-family:"Inter","Helvetica Neue",Arial,"Noto Sans TC","PingFang TC",sans-serif;
    text-align:center; padding:24px;
  }
  .gate{ max-width:520px; }
  .gate__mark{ width:56px; height:56px; border-radius:999px; }
  .gate__code{ margin:20px 0 0; font-size:44px; font-weight:700; line-height:1;
               letter-spacing:.02em; color:rgba(242,245,248,.28); }
  .gate__name{ margin:16px 0 4px; font-size:18px; font-weight:700; letter-spacing:.01em; }
  .gate__en{ margin:0; font-size:11px; font-weight:500; letter-spacing:.08em;
             text-transform:uppercase; color:rgba(242,245,248,.62); }
  .gate__list{ list-style:none; margin:32px 0 0; padding:0;
               display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
  .gate__link{
    display:block; padding:12px 20px; border-radius:8px;
    border:1px solid rgba(242,245,248,.24);
    color:#F2F5F8; text-decoration:none; font-size:15px; font-weight:500;
    transition:border-color .18s ease, background-color .18s ease;
  }
  .gate__link:hover,.gate__link:focus-visible{
    border-color:rgba(242,245,248,.55); background:rgba(242,245,248,.08);
  }
  .gate__note{ margin:24px 0 0; font-size:12px; line-height:1.7; color:rgba(242,245,248,.52); }
</style>
</head>
<body>

<div class="gate">
  <img class="gate__mark" src="assets/img/logo-96.png" data-rel="assets/img/logo-96.png"
       width="56" height="56" alt="">
  <p class="gate__code">404</p>
  <p class="gate__name">{{ site_name }}</p>
  <p class="gate__en">{{ site_name_en }}</p>

  <ul class="gate__list">
    {%- for l in langs %}
    <li><a class="gate__link" href="{{ l.code }}/index.html" data-rel="{{ l.code }}/index.html"
           hreflang="{{ l.hreflang }}" lang="{{ l.hreflang }}">{{ l.name }}</a></li>
    {%- endfor %}
  </ul>

  <p class="gate__note">
    找不到此頁面 · 找不到此页面 · Page not found · ページが見つかりません<br>
    Redirecting… · 正在返回首頁
  </p>
</div>

<script>
(function () {
  /* GitHub Pages 會把同一份 404.html 套用到任何深度的網址（/repo/en/nope 也是它），
     此時頁面裡的相對連結會以那個錯誤的網址為基準。
     BASE 是建置時由 SITE_URL 推導的站台根路徑（專案頁面 "/<repo>/"，自訂網域 "/"）；
     只在目前網址真的落在 BASE 之下時才改寫連結，否則（file://、預覽伺服器、
     SITE_URL 設錯）維持相對路徑，行為與 gateway 相同。 */
  var BASE = "{{ base_path }}";
  var prefix = (location.protocol.indexOf("http") === 0 &&
                location.pathname.indexOf(BASE) === 0) ? BASE : "";

  if (prefix) {
    var nodes = document.querySelectorAll("[data-rel]");
    for (var i = 0; i < nodes.length; i++) {
      var n = nodes[i], rel = prefix + nodes[i].getAttribute("data-rel");
      if (n.tagName === "IMG") { n.src = rel; } else { n.setAttribute("href", rel); }
    }
  }

  /* 自動導回語言分流閘道，由它依瀏覽器語言決定版本。 */
  setTimeout(function () { location.replace(prefix + "index.html"); }, 4000);
})();
</script>

</body>
</html>
